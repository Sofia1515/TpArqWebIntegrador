server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
      routes:
        - id: usuario-servicio
          uri: ${USUARIO_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/usuarios/**, /api/auth/**

        - id: evento-servicio
          uri: ${EVENTO_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/eventos/**, /api/lugares/**

        - id: reserva-servicio
          uri: ${RESERVA_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/reservas/**, /api/compras/**, /api/entradas/**

jwt:
  secret: ticketya-secreto-de-desarrollo-cambiar-en-produccion-32chars