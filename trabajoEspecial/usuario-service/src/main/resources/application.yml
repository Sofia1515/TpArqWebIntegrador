server:
  port: 8081

spring:
  application:
    name: usuario-servicio

  datasource:
    url: jdbc:mysql://localhost:3306/ticketya_usuarios?useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    mongodb:
      uri: mongodb://localhost:27017/ticketya_preferencias

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true